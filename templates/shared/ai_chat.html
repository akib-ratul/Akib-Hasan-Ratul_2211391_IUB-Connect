{% extends "dashboard.html" %}
{% load static %}
{% block title %}AI Assistant — IUB Connect{% endblock %}

{% block content %}
<style>
  .ai-chat-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 2rem);
    background: var(--dark-800);
    border-radius: var(--radius-lg);
    border: 1px solid var(--dark-700);
    overflow: hidden;
  }
  .ai-chat-header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--dark-700);
    display: flex;
    align-items: center;
    gap: .75rem;
    background: var(--dark-800);
  }
  .ai-chat-header .avatar {
    background: var(--primary-500);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ai-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }
  .ai-chat-input-area {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--dark-700);
    background: var(--dark-800);
  }
  .ai-msg-row {
    display: flex;
    width: 100%;
  }
  .ai-msg-mine {
    justify-content: flex-end;
  }
  .ai-msg-other {
    justify-content: flex-start;
  }
  .ai-msg-bubble {
    max-width: 75%;
    padding: .75rem 1rem;
    border-radius: var(--radius-md);
    font-size: .9375rem;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .ai-msg-mine .ai-msg-bubble {
    background: var(--primary-500);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .ai-msg-other .ai-msg-bubble {
    background: var(--dark-700);
    color: var(--dark-50);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--dark-600);
  }
  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 4px;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    background: var(--dark-400);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typing {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
</style>

<div class="ai-chat-container animate-fade-in">
  <div class="ai-chat-header">
    <div class="avatar">
      <i data-lucide="bot" style="width:24px;height:24px"></i>
    </div>
    <div>
      <h2 style="font-size:1.125rem;font-weight:700;color:var(--dark-50)">AI Assistant</h2>
    </div>
  </div>

  <div class="ai-chat-messages" id="aiChatMessages">
    <div class="ai-msg-row ai-msg-other">
      <div class="ai-msg-bubble">
        Hello! I'm your IUB Connect AI Assistant. How can I help you with your academic or career queries today?
      </div>
    </div>
  </div>

  <div class="ai-chat-input-area">
    <form id="aiChatForm" style="display:flex;gap:.5rem;align-items:center">
      {% csrf_token %}
      <input type="text" id="aiChatInput" class="input-field" placeholder="Ask something..." autocomplete="off" required style="flex:1">
      <button type="submit" class="btn btn-primary" id="aiSendBtn">
        <i data-lucide="send" style="width:18px;height:18px"></i>
      </button>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const chatForm = document.getElementById('aiChatForm');
    const chatInput = document.getElementById('aiChatInput');
    const chatMessages = document.getElementById('aiChatMessages');
    const sendBtn = document.getElementById('aiSendBtn');
    
    function addMessage(text, isMine) {
      const row = document.createElement('div');
      row.className = `ai-msg-row ${isMine ? 'ai-msg-mine' : 'ai-msg-other'}`;
      
      const bubble = document.createElement('div');
      bubble.className = 'ai-msg-bubble';
      bubble.innerText = text; // Secure from XSS
      
      row.appendChild(bubble);
      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'ai-msg-row ai-msg-other';
      row.id = 'typingIndicator';
      
      const bubble = document.createElement('div');
      bubble.className = 'ai-msg-bubble';
      
      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      
      bubble.appendChild(indicator);
      row.appendChild(bubble);
      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.remove();
      }
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      // Add my message
      addMessage(message, true);
      chatInput.value = '';
      sendBtn.disabled = true;
      chatInput.disabled = true;

      // Add typing indicator
      addTypingIndicator();

      try {
        const response = await fetch('/api/ai-chat/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        removeTypingIndicator();
        
        if (response.ok) {
          addMessage(data.message, false);
        } else {
          addMessage(`Error: ${data.error || 'Something went wrong.'}`, false);
        }
      } catch (error) {
        removeTypingIndicator();
        addMessage('Error: Failed to connect to the server.', false);
      } finally {
        sendBtn.disabled = false;
        chatInput.disabled = false;
        chatInput.focus();
      }
    });
  });
</script>
{% endblock %}
